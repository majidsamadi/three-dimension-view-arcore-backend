name: Verify Home backend boundary

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified current main commit to dev (account 511831442607)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: home-backend-verify-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: its deploy job may hold the remote-state lock.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    name: Python boundary and draft contract fixture check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the hash-pinned test-only YAML parser
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-ci.txt'
      - name: Verify draft contract fixture checksums
        run: python tools/check_contract_fixtures.py
      - name: Verify v0.4 draft contract fixture checksums
        run: python tools/check_contract_fixtures_v0_4.py
      - name: Run unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Build the deterministic Lambda package
        run: python tools/build_lambda.py

  terraform:
    name: Terraform fmt, validate and mocked tests (no credentials, no plan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Terraform 1.15.8
        run: bash tools/install_terraform.sh "$RUNNER_TEMP/terraform-bin"
      - name: Format check
        run: '"$RUNNER_TEMP/terraform-bin/terraform" -chdir=infra/application fmt -check -recursive'
      - name: Init without backend
        run: '"$RUNNER_TEMP/terraform-bin/terraform" -chdir=infra/application init -backend=false -input=false -lockfile=readonly'
      - name: Validate
        run: '"$RUNNER_TEMP/terraform-bin/terraform" -chdir=infra/application validate -no-color'
      - name: Mocked stack tests (mock_provider, no AWS calls)
        run: '"$RUNNER_TEMP/terraform-bin/terraform" -chdir=infra/application test -no-color'

  deploy:
    name: Guarded dev deployment (OIDC, account 511831442607)
    needs: [boundary, terraform]
    if: github.repository == 'majidsamadi/three-dimension-view-arcore-backend' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: wisestay-dev-home-scanner-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Terraform 1.15.8
        run: bash tools/install_terraform.sh "$RUNNER_TEMP/terraform-bin"
      - name: Build the deterministic Lambda package
        run: python tools/build_lambda.py
      - name: Reject superseded main before AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Assume only the Home Scanner dev deploy role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::511831442607:role/wisestay/deploy/dev/wisestay-dev-home-scanner-deploy
          aws-region: ap-southeast-1
          allowed-account-ids: '511831442607'
          role-session-name: home-scanner-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Verify caller account 511831442607 and the deploy role before Terraform
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "511831442607"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::511831442607:assumed-role/wisestay-dev-home-scanner-deploy/*) ;;
            *) echo "Unexpected caller role" >&2; exit 1 ;;
          esac
      - name: Guarded plan, admission, apply, smoke and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deployment/deploy.py --terraform "$RUNNER_TEMP/terraform-bin/terraform"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-receipt-${{ github.sha }}
          path: dist/deployment-receipt.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Remove private deployment files
        if: always()
        run: rm -rf "$RUNNER_TEMP"/home-scanner-deploy-* infra/application/.terraform dist/home-scanner-lambda.zip
