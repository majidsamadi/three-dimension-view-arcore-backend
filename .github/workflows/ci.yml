name: Verify Home backend boundary

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: home-backend-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Python boundary and draft contract fixture check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify draft contract fixture checksums
        run: python tools/check_contract_fixtures.py
      - name: Verify v0.4 draft contract fixture checksums
        run: python tools/check_contract_fixtures_v0_4.py
      - name: Run unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
